spring.application.name=Job-Portal
server.port=8081
spring.data.mongodb.auto-index-creation=true
//spring.mongodb.uri=mongodb://localhost:27017/jobportal
spring.mongodb.uri=${MONGODB_URI}

#Email properties

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


USER_FOUND = User alreay registered.
USER_NOT_FOUND = User is not registered yet.
INVALID_CREDENTIALS = Invalid Credentials.
OTP_NOT_FOUND = OTP is expired.
OTP_INCORRECT = OTP is incorrect.

JOB_NOT_FOUND = Job not found.
JOB_APPLIED_ALREADY = Job applied already.